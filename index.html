<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MODA | متجر الأزياء العصرية</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #181b22;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #e5a93c;
      --accent-hover: #cf9327;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green: #25d366;
      --radius: 16px;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Top Brand Header */
    .store-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px 18px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }

    .brand-info h1 {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-info span {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .cart-trigger {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .cart-badge {
      position: absolute;
      top: -6px;
      left: -6px;
      background: var(--accent);
      color: #0f1115;
      font-size: 0.7rem;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Category Filter Tabs */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #0f1115;
      border-color: var(--accent);
    }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      position: relative;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #252a34;
    }

    .product-details {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-title {
      font-size: 0.84rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
      line-height: 1.3;
    }

    .product-price {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 8px;
    }

    /* Size selector inside card */
    .size-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .size-pill {
      font-size: 0.68rem;
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      background: rgba(255,255,255,0.03);
    }

    .size-pill.selected {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(229, 169, 60, 0.1);
      font-weight: 800;
    }

    .add-to-cart-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .add-to-cart-btn:hover, .add-to-cart-btn:active {
      background: var(--accent);
      color: #0f1115;
      border-color: var(--accent);
    }

    /* Floating Cart Checkout Bar */
    .cart-float-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(24, 27, 34, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 900;
    }

    .cart-float-inner {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-total-text span {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: block;
    }

    .cart-total-text strong {
      font-size: 1.15rem;
      color: var(--accent);
      font-weight: 900;
    }

    .checkout-btn {
      background: var(--green);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }

    /* Modal Sheet for Cart & Checkout */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-content {
      background: #181b22;
      width: 100%;
      max-width: 500px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid var(--card-border);
      padding: 20px 16px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-header h3 { font-size: 1.1rem; color: #fff; font-weight: 800; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; }

    .cart-items-list {
      margin-bottom: 18px;
      max-height: 200px;
      overflow-y: auto;
    }

    .cart-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .cart-item-info strong { display: block; color: #fff; font-size: 0.84rem; }
    .cart-item-info small { color: var(--accent); }

    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Checkout Inputs */
    .form-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; display: block; font-weight: 600; }
    .form-input {
      width: 100%;
      background: #0f1115;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      padding: 10px 12px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      outline: none;
    }
    .form-input:focus { border-color: var(--accent); }

    .submit-order-btn {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Store Brand Header -->
    <header class="store-header">
      <div class="brand-info">
        <h1>MODA BOUTIQUE</h1>
        <span>أزياء راقية & شحن فوري</span>
      </div>
      <div class="cart-trigger" onclick="openCartModal()">
        <i class="fas fa-shopping-bag"></i>
        <div class="cart-badge" id="cartCountBadge">0</div>
      </div>
    </header>

    <!-- Categories Filtering -->
    <div class="categories-bar">
      <button class="cat-btn active" onclick="filterProducts('all', this)">الكل</button>
      <button class="cat-btn" onclick="filterProducts('men', this)">رجالي</button>
      <button class="cat-btn" onclick="filterProducts('women', this)">نسائي</button>
      <button class="cat-btn" onclick="filterProducts('formal', this)">رسمي وشتوي</button>
    </div>

    <!-- Product Grid -->
    <div class="products-grid" id="productsContainer">
      <!-- يتم توليد المنتجات عبر JavaScript -->
    </div>

  </div>

  <!-- Bottom Floating Cart Bar -->
  <aside class="cart-float-bar" id="cartBar">
    <div class="cart-float-inner">
      <div class="cart-total-text">
        <span>الإجمالي المتوقع:</span>
        <strong id="barTotalPrice">0 ل.س</strong>
      </div>
      <button class="checkout-btn" onclick="openCartModal()">
        <i class="fab fa-whatsapp"></i> معاينة الطلب
      </button>
    </div>
  </aside>

  <!-- Cart & Order Modal Sheet -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fas fa-shopping-bag" style="color:var(--accent);"></i> تفاصيل السلة والطلب</h3>
        <button class="close-btn" onclick="closeCartModal()">&times;</button>
      </div>

      <!-- Items List -->
      <div class="cart-items-list" id="cartItemsContainer">
        <!-- عناصر السلة -->
      </div>

      <div style="display:flex; justify-content:space-between; margin-bottom:14px; font-weight:800; font-size:1rem; border-top:1px dashed var(--card-border); padding-top:10px;">
        <span>المجموع النهائي:</span>
        <span style="color:var(--accent);" id="modalTotalPrice">0 ل.س</span>
      </div>

      <!-- Customer Form -->
      <div>
        <label class="form-label">الاسم الكريم</label>
        <input type="text" id="custName" class="form-input" placeholder="مثال: محمد، سارة...">

        <label class="form-label">المدينة / العنوان بالتفصيل</label>
        <input type="text" id="custAddress" class="form-input" placeholder="مثال: دمشق - المزة، طرطوس، اللاذقية...">

        <label class="form-label">ملاحظات إضافية (اختياري)</label>
        <input type="text" id="custNotes" class="form-input" placeholder="توقيت التسليم المفضل أو تعليمات خاصة...">

        <button class="submit-order-btn" onclick="sendOrderViaWhatsApp()">
          <i class="fab fa-whatsapp" style="font-size:1.2rem;"></i> إرسال الطلب عبر واتساب الآن
        </button>
      </div>
    </div>
  </div>

  <script>
    // المنتجات التجريبية الجاهزة للعرض الفوري
    const productsData = [
      {
        id: 1,
        title: "كنزة هودي أوفر سايز بيج",
        price: 220000,
        category: "men",
        image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=500&q=80",
        sizes: ["M", "L", "XL"]
      },
      {
        id: 2,
        title: "فستان سهرة كلاسيك أسود",
        price: 380000,
        category: "women",
        image: "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=500&q=80",
        sizes: ["S", "M", "L"]
      },
      {
        id: 3,
        title: "جاكيت بليزر رجالي رسمي",
        price: 490000,
        category: "formal",
        image: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=500&q=80",
        sizes: ["48", "50", "52"]
      },
      {
        id: 4,
        title: "قميص كتان صيفي أبيض",
        price: 185000,
        category: "men",
        image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=500&q=80",
        sizes: ["M", "L", "XL"]
      },
      {
        id: 5,
        title: "طقم قطعتين أنيق بناتي",
        price: 310000,
        category: "women",
        image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=500&q=80",
        sizes: ["S", "M"]
      },
      {
        id: 6,
        title: "معطف صوف شتوي طويل",
        price: 580000,
        category: "formal",
        image: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=500&q=80",
        sizes: ["M", "L"]
      }
    ];

    let cart = [];
    const selectedSizes = {};

    // تهيئة وعرض المنتجات
    function renderProducts(items) {
      const container = document.getElementById('productsContainer');
      container.innerHTML = '';

      items.forEach(prod => {
        if (!selectedSizes[prod.id]) {
          selectedSizes[prod.id] = prod.sizes[0];
        }

        const sizePills = prod.sizes.map(s => 
          `<span class="size-pill ${selectedSizes[prod.id] === s ? 'selected' : ''}" onclick="pickSize(${prod.id}, '${s}', this)">${s}</span>`
        ).join('');

        container.innerHTML += `
          <div class="product-card">
            <img src="${prod.image}" alt="${prod.title}" loading="lazy">
            <div class="product-details">
              <div>
                <h4 class="product-title">${prod.title}</h4>
                <div class="product-price">${prod.price.toLocaleString()} ل.س</div>
                <div class="size-selector">${sizePills}</div>
              </div>
              <button class="add-to-cart-btn" onclick="addToCart(${prod.id})">
                <i class="fas fa-plus"></i> أضف للسلة
              </button>
            </div>
          </div>
        `;
      });
    }

    // فلترة المنتجات حسب القسم
    window.filterProducts = (cat, btn) => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (cat === 'all') {
        renderProducts(productsData);
      } else {
        const filtered = productsData.filter(p => p.category === cat);
        renderProducts(filtered);
      }
    };

    // اختيار المقاس
    window.pickSize = (prodId, size, elm) => {
      selectedSizes[prodId] = size;
      const parent = elm.parentElement;
      parent.querySelectorAll('.size-pill').forEach(p => p.classList.remove('selected'));
      elm.classList.add('selected');
    };

    // إضافة إلى السلة
    window.addToCart = (prodId) => {
      const prod = productsData.find(p => p.id === prodId);
      const chosenSize = selectedSizes[prodId] || prod.sizes[0];

      const existingIndex = cart.findIndex(item => item.id === prodId && item.size === chosenSize);
      if (existingIndex > -1) {
        cart[existingIndex].qty += 1;
      } else {
        cart.push({
          id: prod.id,
          title: prod.title,
          price: prod.price,
          size: chosenSize,
          qty: 1
        });
      }
      updateCartUI();
    };

    // تحديث واجهة السلة
    function updateCartUI() {
      const count = cart.reduce((acc, item) => acc + item.qty, 0);
      const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

      document.getElementById('cartCountBadge').textContent = count;
      document.getElementById('barTotalPrice').textContent = total.toLocaleString() + ' ل.س';
      document.getElementById('modalTotalPrice').textContent = total.toLocaleString() + ' ل.س';

      // رسم العناصر داخل نافذة المودال
      const listContainer = document.getElementById('cartItemsContainer');
      if (cart.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:16px;">السلة فارغة حالياً</p>';
      } else {
        listContainer.innerHTML = cart.map((item, idx) => `
          <div class="cart-item-row">
            <div class="cart-item-info">
              <strong>${item.title}</strong>
              <small>المقاس: ${item.size} | ${(item.price * item.qty).toLocaleString()} ل.س</small>
            </div>
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
              <span style="font-weight:700;">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
            </div>
          </div>
        `).join('');
      }
    }

    window.changeQty = (index, delta) => {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      updateCartUI();
    };

    // إدارة المودال
    window.openCartModal = () => {
      document.getElementById('orderModal').style.display = 'flex';
      updateCartUI();
    };

    window.closeCartModal = () => {
      document.getElementById('orderModal').style.display = 'none';
    };

    // إرسال الطلب المباشر للرقم المحدد عبر واتساب
    window.sendOrderViaWhatsApp = () => {
      if (cart.length === 0) {
        alert("يرجى إضافة منتجات إلى السلة أولاً");
        return;
      }

      const name = document.getElementById('custName').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const notes = document.getElementById('custNotes').value.trim();

      if (!name || !address) {
        alert("يرجى كتابة الاسم والمدينة/العنوان لإتمام الطلب");
        return;
      }

      const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

      // صياغة تفاصيل المنتجات
      let itemsDetails = "";
      cart.forEach((item, i) => {
        itemsDetails += `\n${i + 1}. ${item.title} (مقاس: ${item.size}) × ${item.qty} = ${(item.price * item.qty).toLocaleString()} ل.س`;
      });

      const message = `مرحباً MODA BOUTIQUE، أرغب بتثبيت طلب شراء جديد 🛍️:
----------------------------
👤 الاسم: ${name}
📍 العنوان: ${address}
${notes ? `📝 ملاحظات: ${notes}\n` : ''}----------------------------
📦 المنتجات المطلوبة:${itemsDetails}
----------------------------
💰 المجموع الإجمالي: ${total.toLocaleString()} ل.س
🚚 يرجى تأكيد الطلب وتحديد موعد الشحن والتسليم.`;

      // الرقم المرتبط مع الرمز الدولي لسوريا (+963)
      const targetPhone = "963995382496";
      const waUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`;

      window.open(waUrl, '_blank');
    };

    // إغلاق النافذة عند الضغط في الخلفية
    window.onclick = (e) => {
      const modal = document.getElementById('orderModal');
      if (e.target === modal) closeCartModal();
    };

    // بدء التشغيل
    renderProducts(productsData);
  </script>
</body>
  </html>
